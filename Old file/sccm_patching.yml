---
- name: Poll Windows WMI and hotfix readiness before SCCM reinstall
  ansible.windows.win_powershell:
    error_action: stop
    script: |
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      $Ansible.Result = @{
          ready  = $false
          reason = 'Readiness checks have not completed.'
      }

      try {
          # Windows WMI must respond.
          $os = Get-CimInstance `
              -ClassName Win32_OperatingSystem `
              -ErrorAction Stop

          if (-not $os.BuildNumber) {
              throw 'Windows WMI did not return an OS build.'
          }

          # An empty hotfix list is allowed; query failure is not.
          $hotfixes = @(Get-HotFix -ErrorAction Stop)

          # SCCM can be absent before reinstall.
          $ccm = @(
              Get-CimInstance `
                  -Namespace root `
                  -ClassName __Namespace `
                  -ErrorAction Stop |
              Where-Object Name -EQ 'ccm'
          )

          if ($ccm.Count -gt 0) {
              $sdk = @(
                  Get-CimInstance `
                      -Namespace root\ccm `
                      -ClassName __Namespace `
                      -ErrorAction Stop |
                  Where-Object Name -EQ 'ClientSDK'
              )

              if ($sdk.Count -gt 0) {
                  # Test query readiness only.
                  # The next existing evidence task checks update errors.
                  $null = @(
                      Get-CimInstance `
                          -Namespace root\ccm\ClientSDK `
                          -ClassName CCM_SoftwareUpdate `
                          -ErrorAction Stop
                  )
              }
          }

          $Ansible.Result = @{
              ready        = $true
              build        = [string]$os.BuildNumber
              hotfix_count = $hotfixes.Count
              reason       = 'Windows WMI and hotfix queries succeeded.'
          }
      }
      catch {
          $Ansible.Result = @{
              ready  = $false
              reason = $_.Exception.Message
          }
      }
  register: sccm_windows_readiness
  until: sccm_windows_readiness.result.ready | default(false) | bool
  retries: 45
  delay: 15

- name: Capture initial servicing evidence and protect in-flight updates before reinstall
  vars:
    sccm_prereinstall_probe_script: "try {\n    $ErrorActionPreference = 'Stop'\n    $Ansible.Changed = $false\n\
      \    $v = Get-ItemProperty 'HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion'\n    if ([string]$v.CurrentBuildNumber\
      \ -ne '20348') {\n        throw \"Server 2022 build 20348 required; current build=$($v.CurrentBuildNumber).\"\
      \n    }\n    \n    # Existing SCCM records are diagnostic only before client reinstall.\n    # No EvaluationState\
      \ or ErrorCode contributes to the blocker list.\n    $u = @()\n    $sdkQueryWarning = ''\n    try {\n    \
      \    $spaces = @(Get-CimInstance -Namespace root -ClassName __Namespace -OperationTimeoutSec 30 -ErrorAction\
      \ Stop)\n        if (@($spaces | Where-Object Name -EQ 'ccm').Count) {\n            $sdk = @(Get-CimInstance\
      \ -Namespace root\\ccm -ClassName __Namespace -OperationTimeoutSec 30 -ErrorAction Stop |\n              \
      \  Where-Object Name -EQ 'ClientSDK')\n            if ($sdk.Count) {\n                $u = @(Get-CimInstance\
      \ -Namespace root\\ccm\\ClientSDK `\n                    -ClassName CCM_SoftwareUpdate -OperationTimeoutSec\
      \ 30 -ErrorAction Stop)\n            }\n        }\n    }\n    catch {\n        $sdkQueryWarning = $_.Exception.Message\n\
      \        Write-Warning \"Existing SCCM update evidence unavailable: $sdkQueryWarning. Windows servicing checks\
      \ still apply.\"\n    }\n    \n    $setupFlags = Get-ItemProperty -LiteralPath 'HKLM:\\SYSTEM\\Setup' -ErrorAction\
      \ Stop\n    if ($null -eq $setupFlags.SystemSetupInProgress -or $null -eq $setupFlags.OOBEInProgress) {\n\
      \        throw 'Windows Setup registry flags are unavailable; cannot confirm OS readiness for reinstall.'\n\
      \    }\n    $windowsSetupBusy = (\n        $setupFlags.SystemSetupInProgress -ne 0 -or\n        $setupFlags.OOBEInProgress\
      \ -ne 0\n    )\n    \n    $cbs = 'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Component Based Servicing'\n\
      \    $rebootPending = (Test-Path \"$cbs\\RebootPending\") -or\n        (Test-Path 'HKLM:\\SOFTWARE\\Microsoft\\\
      Windows\\CurrentVersion\\WindowsUpdate\\Auto Update\\RebootRequired')\n    $servicingPending = (Test-Path\
      \ \"$cbs\\PackagesPending\") -or (Test-Path \"$cbs\\RebootInProgress\")\n    $installerBusy = Test-Path 'HKLM:\\\
      SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Installer\\InProgress'\n    $busyProcesses = @(Get-Process -Name\
      \ ccmsetup,setup,setuphost,setupprep,dism,dismhost,poqexec `\n        -ErrorAction SilentlyContinue | Select-Object\
      \ -ExpandProperty ProcessName)\n    # msiexec.exe may remain running when idle. Its presence is evidence only.\n\
      \    $msiProcesses = @(Get-Process -Name msiexec -ErrorAction SilentlyContinue |\n        Select-Object Id,ProcessName,StartTime)\n\
      \    $mutex = $null\n    $ownsMutex = $false\n    $msiMutexBusy = $false\n    $msiMutexWarning = ''\n    try\
      \ {\n        $mutex = [System.Threading.Mutex]::OpenExisting('Global\\_MSIExecute')\n        try { $ownsMutex\
      \ = $mutex.WaitOne(0) }\n        catch [System.Threading.AbandonedMutexException] { $ownsMutex = $true }\n\
      \        $msiMutexBusy = -not $ownsMutex\n    }\n    catch [System.Threading.WaitHandleCannotBeOpenedException]\
      \ {\n        # No execution mutex currently exists.\n    }\n    catch {\n        # An unreadable lock is uncertain,\
      \ not proof that it is free.\n        $msiMutexBusy = $true\n        $msiMutexWarning = $_.Exception.Message\n\
      \    }\n    finally {\n        if ($ownsMutex -and $null -ne $mutex) { $mutex.ReleaseMutex() }\n        if\
      \ ($null -ne $mutex) { $mutex.Dispose() }\n    }\n    $msiService = Get-Service -Name msiserver -ErrorAction\
      \ Stop\n    $msiServiceBusy = ($msiService.Status -eq 'Running' -and -not $msiService.CanStop)\n    $msiBusy\
      \ = $msiMutexBusy -or $msiServiceBusy\n    $packages = @(Get-WindowsPackage -Online -ErrorAction Stop |\n\
      \        Where-Object { [string]$_.PackageState -in @('InstallPending','UninstallPending') } |\n        Select-Object\
      \ PackageName,PackageState)\n    \n    $history = @($u | Where-Object {\n        $null -eq $_.EvaluationState\
      \ -or $_.EvaluationState -eq 13 -or\n        $_.EvaluationState -notin (0..23) -or\n        ($null -ne $_.ErrorCode\
      \ -and $_.ErrorCode -ne 0)\n    } | Select-Object ArticleID,Name,UpdateID,ComplianceState,EvaluationState,ErrorCode)\n\
      \    if ($history.Count) {\n        Write-Warning 'Existing update errors/unknown records captured as pre-reinstall\
      \ evidence. They do not independently block reinstall; fresh deployment/scan validation remains required.'\n\
      \    }\n    \n    $reasons = @()\n    if ($windowsSetupBusy) { $reasons += 'Windows Setup/OOBE is in progress.'\
      \ }\n    if ($rebootPending) { $reasons += 'Reboot pending: clear it through the approved reboot flow before\
      \ reinstall.' }\n    if ($servicingPending -or $packages.Count) { $reasons += 'Windows servicing/package finalization\
      \ pending.' }\n    if ($installerBusy -or $msiBusy) { $reasons += 'Windows Installer transaction/execution\
      \ lock is active or uncertain.' }\n    if ($busyProcesses.Count) { $reasons += 'Setup/servicing/client installer\
      \ process detected.' }\n    # Pending packages/CBS markers can require a reboot without a live installer.\n\
      \    # Reboot is allowed only after active/uncertain installer checks have cleared.\n    $activityBusy = (\n\
      \        $windowsSetupBusy -or $installerBusy -or $msiBusy -or\n        $busyProcesses.Count -gt 0 -or (Test-Path\
      \ \"$cbs\\RebootInProgress\")\n    )\n    $needsReboot = $rebootPending -or $servicingPending -or $packages.Count\
      \ -gt 0\n    $Ansible.Result = @{\n        full_build = \"$($v.CurrentBuildNumber).$($v.UBR)\"\n        hotfixes\
      \ = @(Get-HotFix -ErrorAction Stop | ForEach-Object HotFixID)\n        inflight = [bool]($reasons.Count -gt\
      \ 0)\n        ready_for_reinstall = [bool]($reasons.Count -eq 0)\n        blockers = $reasons\n        sccm_states_are_evidence_only\
      \ = $true\n        sccm_query_warning = $sdkQueryWarning\n        windows_setup_in_progress = [bool]$windowsSetupBusy\n\
      \        historical_update_errors = $history\n        updates_before_reinstall = @($u | Select-Object ArticleID,Name,UpdateID,ComplianceState,EvaluationState,ErrorCode)\n\
      \        reboot_pending = [bool]$rebootPending\n        servicing_pending = [bool]$servicingPending\n    \
      \    pending_packages = $packages\n        busy_processes = $busyProcesses\n        installer_transaction\
      \ = [bool]$installerBusy\n        msi_processes_evidence_only = $msiProcesses\n        msi_execution_mutex_busy\
      \ = [bool]$msiMutexBusy\n        msi_mutex_warning = $msiMutexWarning\n        msi_service_state = [string]$msiService.Status\n\
      \        msi_service_accepts_stop = [bool]$msiService.CanStop\n        activity_busy = [bool]$activityBusy\n\
      \        recovery_reboot_needed = [bool]$needsReboot\n        probe_ok = $true\n        reason = ($reasons\
      \ -join ' ')\n    }\n}\ncatch {\n    $Ansible.Changed = $false\n    $Ansible.Result = @{\n        probe_ok\
      \ = $false\n        ready_for_reinstall = $false\n        activity_busy = $true\n        inflight = $true\n\
      \        reason = $_.Exception.Message\n    }\n}\n"
  block:
  - name: Validate pre-reinstall recovery settings
    ansible.builtin.assert:
      that:
      - not ansible_check_mode
      - sccm_prereinstall_recovery_timeout | default(1800) | int >= 60
      - sccm_prereinstall_recovery_timeout | default(1800) | int <= 7200
      fail_msg: Normal execution required; optional sccm_prereinstall_recovery_timeout must be 60..7200 seconds.
  - name: Start bounded pre-reinstall readiness budget
    ansible.builtin.set_fact:
      sccm_prereinstall_deadline: '{{ (lookup(''ansible.builtin.pipe'', ''date +%s'') | int) + (sccm_prereinstall_recovery_timeout
        | default(1800) | int) }}'
  - name: Recover Windows connectivity before readiness checks
    ansible.builtin.wait_for_connection:
      timeout: 600
      connect_timeout: 15
      sleep: 15
  - name: Poll installer and servicing activity before deciding recovery
    ansible.windows.win_powershell:
      error_action: stop
      depth: 5
      script: '{{ sccm_prereinstall_probe_script }}'
    register: sccm_guard_observation
    timeout: 180
    until: (((sccm_guard_observation.result | default({})).get('probe_ok', false) | bool) and not ((sccm_guard_observation.result
      | default({})).get('activity_busy', true) | bool)) or (lookup('ansible.builtin.pipe', 'date +%s') | int) >=
      (sccm_prereinstall_deadline | int)
    retries: 180
    delay: 15
    changed_when: false
    ignore_errors: true
    ignore_unreachable: true
  - name: Display pre-reinstall readiness evidence
    ansible.builtin.debug:
      var: sccm_guard_observation
  - name: Require a readable system state and completed installer activity
    ansible.builtin.assert:
      that:
      - not (sccm_guard_observation.failed | default(false) | bool)
      - not (sccm_guard_observation.unreachable | default(false) | bool)
      - (sccm_guard_observation.result | default({})).get('probe_ok', false) | bool
      - not ((sccm_guard_observation.result | default({})).get('activity_busy', true) | bool)
      fail_msg: 'SCCM reinstall not started after bounded readiness polling. {{ sccm_guard_observation.result |
        default({}) | to_json }} Connection/module detail: {{ sccm_guard_observation.msg | default(''See observation
        above.'') }}'
  - name: Retain current readiness and recovery decision
    ansible.builtin.set_fact:
      sccm_before: '{{ sccm_guard_observation }}'
      sccm_guard_reboot_needed: '{{ sccm_guard_observation.result.recovery_reboot_needed | bool }}'
  - name: Clear pending reboot and recheck without repeating client reinstall
    when: sccm_guard_reboot_needed | bool
    block:
    - name: Require existing reboot approval for automatic recovery
      ansible.builtin.assert:
        that:
        - sccm_allow_reboot | default(false) | bool
        fail_msg: Recovery requires a reboot, but sccm_allow_reboot is false. SCCM reinstall was not started.
    - name: Perform one controlled pre-reinstall recovery reboot
      ansible.windows.win_reboot:
        reboot_timeout: '{{ sccm_reboot_timeout | default(7200) | int }}'
        connect_timeout: 30
        post_reboot_delay: 60
    - name: Reset connection after recovery reboot
      ansible.builtin.meta: reset_connection
    - name: Recover usable Windows connection after recovery reboot
      ansible.builtin.wait_for_connection:
        timeout: 1200
        connect_timeout: 30
        sleep: 15
    - name: Start bounded post-reboot readiness budget
      ansible.builtin.set_fact:
        sccm_prereinstall_deadline: '{{ (lookup(''ansible.builtin.pipe'', ''date +%s'') | int) + (sccm_prereinstall_recovery_timeout
          | default(1800) | int) }}'
    - name: Poll final reinstall readiness after recovery reboot
      ansible.windows.win_powershell:
        error_action: stop
        depth: 5
        script: '{{ sccm_prereinstall_probe_script }}'
      register: sccm_guard_observation
      timeout: 180
      until: ((sccm_guard_observation.result | default({})).get('ready_for_reinstall', false) | bool) or (lookup('ansible.builtin.pipe',
        'date +%s') | int) >= (sccm_prereinstall_deadline | int)
      retries: 180
      delay: 15
      changed_when: false
      ignore_errors: true
      ignore_unreachable: true
    - name: Retain latest readiness after recovery reboot
      ansible.builtin.set_fact:
        sccm_before: '{{ sccm_guard_observation }}'
  - name: Display final pre-reinstall evidence and remaining blockers
    ansible.builtin.debug:
      var: sccm_before
  - name: Require verified readiness after automatic wait and recovery
    ansible.builtin.assert:
      that:
      - not (sccm_before.failed | default(false) | bool)
      - not (sccm_before.unreachable | default(false) | bool)
      - (sccm_before.result | default({})).get('probe_ok', false) | bool
      - (sccm_before.result | default({})).get('ready_for_reinstall', false) | bool
      fail_msg: Automatic wait/recovery did not establish safe reinstall readiness. No installer was killed and
        client reinstall was not started. Evidence={{ sccm_before.result | default({}) | to_json }}. Connection/module
        detail={{ sccm_before.msg | default('None') }}.
      success_msg: Readiness confirmed. Continue one SCCM reinstall, fresh policy, successful scan and deployed
        Server 2022 updates.

- name: Run supplied baseline reinstall before SCCM preflight
  ansible.builtin.import_tasks: sccm_reinstall.yml
  when: not sccm_before.result.inflight | bool

- name: Validate configuration
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
      - sccm_management_host | length > 0
      - sccm_management_host in hostvars
      - sccm_site_code is match('^[A-Za-z0-9]{3}$')
      - sccm_provider_server | length > 0
      - sccm_collection_name | length > 0
      - sccm_deployment_names | length > 0
      - sccm_deployment_names is not string
      - sccm_acknowledge_all_deployed_updates | bool
      - sccm_max_rounds | int > 0
      - sccm_poll_seconds | int > 0
      - sccm_poll_retries | int > 0
      - sccm_policy_timeout | int > 0
      - sccm_scan_timeout | int > 0
      - sccm_client_settle_seconds | int >= 30
      - not (sccm_create_collection | bool) or sccm_limiting_collection_id | length > 0
    fail_msg: Configure required variables and acknowledgement. Check mode is intentionally unsupported.

- name: Initialize per-host ownership and completion state
  ansible.builtin.set_fact:
    sccm_patch_done: false
    sccm_membership_added: false
    sccm_patch_success: false
    sccm_failure_reason: ""

- name: Wait for existing installation to stop before preflight reboot
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', role_path + '/files/client.ps1') }}"
    parameters:
      Action: Status
  register: sccm_existing_job
  until: sccm_existing_job.result.active | int == 0
  retries: "{{ sccm_poll_retries }}"
  delay: "{{ sccm_poll_seconds }}"
  when: sccm_before.result.inflight | bool

- name: Verify upgraded target and client before touching SCCM
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', role_path + '/files/client.ps1') }}"
    parameters:
      Action: Preflight
  register: sccm_target

- name: Debug preflight result
  ansible.builtin.debug:
    var: sccm_target

- name: Require approved preflight reboot
  ansible.builtin.assert:
    that: sccm_allow_reboot | bool
    fail_msg: Pending reboot requires sccm_allow_reboot=true.
  when: sccm_target.result.reboot_pending | default(false) | bool

- name: Reboot upgraded server if preflight detected pending reboot
  ansible.windows.win_reboot:
    reboot_timeout: "{{ sccm_reboot_timeout }}"
    connect_timeout: 30
    post_reboot_delay: 60
  when:
    - sccm_target.result.reboot_pending | default(false) | bool

- name: Reset WinRM connection after preflight reboot
  ansible.builtin.meta: reset_connection

- name: Poll usable Windows connection after preflight reboot
  ansible.builtin.wait_for_connection:
    sleep: 15
    connect_timeout: 30
    timeout: 1200
  when: sccm_target.result.reboot_pending | default(false) | bool


- name: Wait for CcmExec service after reboot
  ansible.windows.win_service_info:
    name: CcmExec
  register: ccm_service
  until:
    - ccm_service.services | length > 0
    - ccm_service.services[0].state == 'started'
  retries: 30
  delay: 20
  when:
    - sccm_target.result.reboot_pending | default(false) | bool

- name: Wait for SCCM readiness after reboot
  ansible.windows.win_powershell:
    script: |
      try {
          $svc = Get-Service `
              -Name CcmExec `
              -ErrorAction Stop

          Get-CimInstance `
              -Namespace root\ccm `
              -ClassName SMS_Client `
              -ErrorAction Stop | Out-Null

          if ($svc.Status -eq 'Running') {
              "READY"
          }
      }
      catch {
          "WAIT"
      }
  register: sccm_ready
  until: "'READY' in sccm_ready.output"
  retries: 30
  delay: 20
  when:
    - sccm_target.result.reboot_pending | default(false) | bool

- name: Re-run preflight after reboot
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', role_path + '/files/client.ps1') }}"
    parameters:
      Action: Preflight
  register: sccm_target_after_reboot
  when:
    - sccm_target.result.reboot_pending | default(false) | bool
    
- name: Require reboot condition cleared
  ansible.builtin.assert:
    that:
      - >-
        not (sccm_target.result.reboot_pending | default(false) | bool) or
        not (sccm_target_after_reboot.result.reboot_pending | default(true) | bool)
    fail_msg: >-
      Reboot pending state persisted after reboot.
      Review CBS servicing state, Windows Update, and SCCM client health.


- name: Manage collection and patch target
  block:
    - name: Resolve collection and verify named deployments before membership change
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', role_path + '/files/management.ps1') }}"
        parameters: "{{ sccm_management_parameters | combine({'Action': 'Prepare'}) }}"
      vars:
        sccm_management_parameters: &management_parameters
          SiteCode: "{{ sccm_site_code }}"
          Provider: "{{ sccm_provider_server }}"
          ModulePath: "{{ sccm_module_path }}"
          CollectionName: "{{ sccm_collection_name }}"
          CreateCollection: "{{ sccm_create_collection | bool }}"
          LimitingCollectionId: "{{ sccm_limiting_collection_id }}"
          DeploymentNames: "{{ sccm_deployment_names }}"
          DeviceName: "{{ inventory_hostname }}"
      delegate_to: "{{ sccm_management_host }}"
      register: sccm_prepare

    - name: Show dynamically selected deployment OS cumulative update
      ansible.builtin.debug:
        var: sccm_prepare.result.expected_update

    - name: Add one-time maintenance window starting now for twelve hours
      ansible.windows.win_powershell:
        script: |
          param(
            [string]$SiteCode,
            [string]$ProviderServer,
            [string]$ModulePath,
            [string]$CollectionName,
            [string]$TargetComputer
           )

          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false

          Import-Module $ModulePath -ErrorAction Stop

          $drive = Get-PSDrive -Name $SiteCode -PSProvider CMSite -ErrorAction SilentlyContinue

          if (-not $drive) {
              $drive = New-PSDrive `
                  -Name $SiteCode `
                  -PSProvider CMSite `
                  -Root $ProviderServer
          }

          if ($drive.Root -ine $ProviderServer) {
              throw 'CMSite drive points to a different SMS Provider.'
          }

          Push-Location ($SiteCode + ':\')

          try {

              $collections = @(
                  Get-CMDeviceCollection -Name $CollectionName |
                  Where-Object Name -EQ $CollectionName
              )

              if ($collections.Count -ne 1) {
                  throw "Expected exactly one collection named '$CollectionName'."
              }

              $estZone = [System.TimeZoneInfo]::FindSystemTimeZoneById('Eastern Standard Time')
              $start   = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $estZone).AddMinutes(-5)
              $end     = $start.AddHours(12)

              $mwName = (
                "Post-upgrade patching - " +
                $TargetComputer +
                " - " +
                $start.ToString('yyyyMMdd-HHmmss')
              )

              $schedule = New-CMSchedule `
                -Start $start `
                -End $end `
                -Nonrecurring

              New-CMMaintenanceWindow `
                  -CollectionId $collections[0].CollectionID `
                  -Name $mwName `
                  -Schedule $schedule `
                  -ApplyTo SoftwareUpdatesOnly `
                  -IsEnabled $true `
                  -Confirm:$false | Out-Null

              $Ansible.Changed = $true

              $Ansible.Result = @{
                  collection_id           = $collections[0].CollectionID
                  maintenance_window_name = $mwName
                  start_local             = $start.ToString('yyyy-MM-dd HH:mm:ss')
                  end_local               = $end.ToString('yyyy-MM-dd HH:mm:ss')
              }

          }
          finally {
              Pop-Location
          }
        parameters:
          SiteCode: "{{ sccm_site_code }}"
          ProviderServer: "{{ sccm_provider_server }}"
          ModulePath: "{{ sccm_module_path }}"
          CollectionName: "{{ sccm_collection_name }}"
          TargetComputer: "{{ inventory_hostname }}"
      delegate_to: "{{ sccm_management_host }}"
      register: sccm_maintenance_window

    - name: Add a direct rule only if neither effective membership nor a direct rule exists
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', role_path + '/files/management.ps1') }}"
        parameters: "{{ sccm_management_parameters | combine({'Action': 'Add', 'CollectionId': sccm_prepare.result.collection_id, 'ResourceId': sccm_prepare.result.resource_id}) }}"
      vars:
        sccm_management_parameters: *management_parameters
      delegate_to: "{{ sccm_management_host }}"
      register: sccm_add

    - name: Record ownership immediately after successful add
      ansible.builtin.set_fact:
        sccm_membership_added: "{{ sccm_add.result.added | bool }}"

    - name: Wait for effective collection membership
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', role_path + '/files/management.ps1') }}"
        parameters: "{{ sccm_management_parameters | combine({'Action': 'Member', 'CollectionId': sccm_prepare.result.collection_id, 'ResourceId': sccm_prepare.result.resource_id}) }}"
      vars:
        sccm_management_parameters: *management_parameters
      delegate_to: "{{ sccm_management_host }}"
      register: sccm_member
      until: sccm_member.result.member | default(false) | bool
      retries: "{{ sccm_poll_retries }}"
      delay: "{{ sccm_poll_seconds }}"

    - name: Retrieve policy and require expected deployment assignments
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', role_path + '/files/client.ps1') }}"
        parameters:
          Action: Policy
          AssignmentIds: "{{ sccm_prepare.result.assignment_ids }}"
          Timeout: "{{ sccm_policy_timeout | int }}"

    - name: Run bounded scan install reboot and rescan rounds
      ansible.builtin.include_tasks: round.yml
      loop: "{{ range(1, (sccm_max_rounds | int) + 1) | list }}"
      loop_control:
        loop_var: sccm_round
      when: not sccm_patch_done | bool

    - name: Require convergence
      ansible.builtin.assert:
        that: sccm_patch_done | bool
        fail_msg: Round limit reached. Inspect SCCM logs before retrying.

    - name: Validate OS client reboot state and application services
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', role_path + '/files/client.ps1') }}"
        parameters:
          Action: Validate
          BeforeBuild: "{{ sccm_before.result.full_build }}"
          BeforeHotfixes: "{{ sccm_before.result.hotfixes }}"
          ExpectedKB: "{{ sccm_prepare.result.expected_update.kb }}"
          RequiredServices: "{{ sccm_required_services }}"
      register: sccm_validation

    - name: Perform final SCCM scan
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', role_path + '/files/client.ps1') }}"
        parameters:
          Action: Scan
          Timeout: "{{ sccm_scan_timeout | int }}"

    - name: Wait for SCCM applicability evaluation
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', role_path + '/files/client.ps1') }}"
        parameters:
          Action: Status
          ExpectedKB: "{{ sccm_prepare.result.expected_update.kb }}"
      register: sccm_status
      retries: 30
      delay: 30
      until: >
        (sccm_status.result.remaining | int > 0)
        or
        (sccm_status.result.terminal | bool)

    - name: Perform final install pass
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', role_path + '/files/client.ps1') }}"
        parameters:
          Action: Install
          ExpectedKB: "{{ sccm_prepare.result.expected_update.kb }}"
      register: sccm_final_install

    - name: Monitor final SCCM compliance
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', role_path + '/files/client.ps1') }}"
        parameters:
          Action: Status
          ExpectedKB: "{{ sccm_prepare.result.expected_update.kb }}"
          MonitorIds: "{{ sccm_final_install.result.monitor_ids | default([]) }}"
      register: sccm_final_status
      until: sccm_final_status.result.terminal | default(false) | bool
      retries: "{{ sccm_poll_retries }}"
      delay: "{{ sccm_poll_seconds }}"

    - name: Show final SCCM compliance result
      ansible.builtin.debug:
            var: sccm_final_status.result  

    - name: Reboot if SCCM requires reboot after final install
      ansible.windows.win_reboot:
        reboot_timeout: 7200
        connect_timeout: 30
        post_reboot_delay: 60
      when:
        - sccm_final_status.result.reboot | default(false) | bool

    - name: Reset WinRM connection after final SCCM reboot
      ansible.builtin.meta: reset_connection

    - name: Poll usable Windows connection after final SCCM reboot
      ansible.builtin.wait_for_connection:
        sleep: 15
        connect_timeout: 30
        timeout: 1200
      when: sccm_final_status.result.reboot | default(false) | bool

    - name: Wait for SCCM readiness after final reboot
      ansible.windows.win_powershell:
        script: |
          try {

              $svc = Get-Service `
                -Name CcmExec `
                -ErrorAction Stop

              Get-CimInstance `
                -Namespace root\ccm `
                -ClassName SMS_Client `
                -ErrorAction Stop | Out-Null

              if ($svc.Status -eq 'Running') {
                  Write-Output "READY"
              }
          }
          catch {
              Write-Output "WAIT"
          }

      register: final_sccm_ready

      until: "'READY' in final_sccm_ready.output"

      retries: 30

      delay: 20

      when:
        - sccm_final_status.result.reboot | default(false) | bool

    - name: Perform final post-reboot SCCM scan
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', role_path + '/files/client.ps1') }}"
        parameters:
          Action: Scan
          Timeout: "{{ sccm_scan_timeout | int }}"
      when:
        - sccm_final_status.result.reboot | default(false) | bool

    - name: Refresh final compliance after any final reboot
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', role_path + '/files/client.ps1') }}"
        parameters:
          Action: Status
          ExpectedKB: "{{ sccm_prepare.result.expected_update.kb }}"
      register: sccm_final_status

    - name: Require no final reboot or active installation
      ansible.builtin.assert:
        that:
          - sccm_final_status.result.terminal | bool
          - not (sccm_final_status.result.reboot | bool)
        fail_msg: Final patch state is not settled; inspect SCCM logs.

    - name: Capture final OS build
      ansible.windows.win_powershell:
        script: |
          $os = Get-ItemProperty `
            'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'

          $Ansible.Result = @{
            Build     = $os.CurrentBuild
            UBR       = $os.UBR
            FullBuild = "$($os.CurrentBuild).$($os.UBR)"
          }
      register: final_build

   
    - name: Interim patching summary
      ansible.builtin.debug:
        msg:
          target: "{{ inventory_hostname }}"
          build: "{{ final_build.result.Build }}"
          ubr: "{{ final_build.result.UBR }}"
          full_build: "{{ final_build.result.FullBuild }}"
          remaining_updates: "{{ sccm_final_status.result.remaining }}"
          validation: "{{ sccm_final_validation.result | default('Not Collected Yet') }}"

    - name: Require final SCCM compliance
      ansible.builtin.assert:
        that:
          - sccm_final_status.result.remaining | int == 0
        fail_msg: >-
          SCCM discovered additional updates after the final install cycle.
          Remaining={{ sccm_final_status.result.remaining }}
    
    - name: Final SCCM update inventory check
      ansible.windows.win_powershell:
        script: |
          $updates = @(
           Get-CimInstance `
               -Namespace root\ccm\ClientSDK `
               -ClassName CCM_SoftwareUpdate `
               -ErrorAction Stop |
           Where-Object { ($_.ComplianceState -ne 1 -and $_.EvaluationState -ne 0) -or $_.ErrorCode -ne 0 -or $_.EvaluationState -eq 13 }
          )

          $Ansible.Result = @{
              update_count = $updates.Count
              updates = @(
                  $updates |
                  Select Name,ComplianceState,EvaluationState,ErrorCode
              )
          }
      register: sccm_inventory_check

    - name: Require zero pending SCCM updates
      ansible.builtin.assert:
        that:
          - sccm_inventory_check.result.update_count | int == 0
        fail_msg: >-
          SCCM still reports
          {{ sccm_inventory_check.result.update_count }}
          update(s) requiring installation.

    - name: Run final post-patch validation
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', role_path + '/files/client.ps1') }}"
        parameters:
          Action: Validate
          BeforeBuild: "{{ sccm_before.result.full_build }}"
          BeforeHotfixes: "{{ sccm_before.result.hotfixes }}"
          ExpectedKB: "{{ sccm_prepare.result.expected_update.kb }}"
          RequiredServices: "{{ sccm_required_services }}"
      register: sccm_final_validation
    
    - name: Mark patching successful
      ansible.builtin.set_fact:
        sccm_patch_success: true

  rescue:
  
    - name: Capture failure reason
      ansible.builtin.set_fact:
        sccm_patch_success: false
        sccm_failure_reason: >-
          {{ ansible_failed_result.error | default(ansible_failed_result.msg | default(ansible_failed_result)) }}

    - name: Report patching failure
      ansible.builtin.debug:
        msg:
          target: "{{ inventory_hostname }}"
          failure: "{{ sccm_failure_reason }}"

    - name: Propagate SCCM failure to the upgrade and Jenkins
      ansible.builtin.fail:
        msg: "SCCM patching failed for {{ inventory_hostname }}: {{ sccm_failure_reason }}"

  always:

    - name: Remove this run maintenance window on success or failure
      failed_when: false
      ansible.windows.win_powershell:
        script: |
          param(
              [string]$SiteCode,
              [string]$ProviderServer,
              [string]$ModulePath,
              [string]$CollectionName,
              [string]$TargetComputer,
              [string]$WindowName
          )

          $ErrorActionPreference = 'Stop'

          Import-Module $ModulePath -ErrorAction Stop

          if (-not (Get-PSDrive -Name $SiteCode -PSProvider CMSite -ErrorAction SilentlyContinue)) {
              New-PSDrive `
                  -Name $SiteCode `
                  -PSProvider CMSite `
                  -Root $ProviderServer | Out-Null
          }

          Push-Location ($SiteCode + ':\')

          try {

              $collection = Get-CMDeviceCollection `
                  -Name $CollectionName

              $windows = @(
                  Get-CMMaintenanceWindow `
                      -CollectionId $collection.CollectionID `
                      -MaintenanceWindowName $WindowName `
                      -DisableWildcardHandling
              )

              foreach ($window in $windows) {

                  Remove-CMMaintenanceWindow `
                      -CollectionId $collection.CollectionID `
                      -MaintenanceWindowName $window.Name `
                      -Confirm:$false `
                      -Force
              }

              $remaining = @(
                  Get-CMMaintenanceWindow `
                      -CollectionId $collection.CollectionID `
                      -MaintenanceWindowName $WindowName `
                      -DisableWildcardHandling
              )
              if ($remaining.Count -gt 0) { throw 'Maintenance window removal verification failed.' }
              $Ansible.Result = @{
                  removed_windows = $windows.Count
                  cleanup_verified = $true
              }
              $Ansible.Changed = ($windows.Count -gt 0)
          }
          finally {
              Pop-Location
          }

        parameters:
          SiteCode: "{{ sccm_site_code }}"
          ProviderServer: "{{ sccm_provider_server }}"
          ModulePath: "{{ sccm_module_path }}"
          CollectionName: "{{ sccm_collection_name }}"
          TargetComputer: "{{ inventory_hostname }}"
          WindowName: "{{ sccm_maintenance_window.result.maintenance_window_name }}"

      delegate_to: "{{ sccm_management_host }}"
      register: sccm_window_cleanup

      when:
        - sccm_maintenance_window is defined
        - sccm_maintenance_window.result is defined
        - sccm_maintenance_window.result.maintenance_window_name | default('') | length > 0

    - name: Remove direct rule added by this invocation
      failed_when: false
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', role_path + '/files/management.ps1') }}"
        parameters: "{{ sccm_management_parameters | combine({
          'Action': 'Remove',
          'CollectionId': sccm_prepare.result.collection_id,
          'ResourceId': sccm_prepare.result.resource_id
        }) }}"
      vars:
        sccm_management_parameters: *management_parameters
      delegate_to: "{{ sccm_management_host }}"
      register: sccm_membership_cleanup
      when:
        - sccm_membership_added | bool
        - sccm_add is defined
        - sccm_prepare is defined
        - sccm_prepare.result is defined
        - sccm_prepare.result.collection_id is defined
        - sccm_prepare.result.resource_id is defined

    # Both cleanup tasks are attempted before evaluating their outcomes.
    - name: Report both cleanup outcomes
      ansible.builtin.debug:
        msg:
          patch_success: "{{ sccm_patch_success }}"
          patch_failure: "{{ sccm_failure_reason | default('') }}"
          maintenance_window: "{{ sccm_window_cleanup.result | default(sccm_window_cleanup.error | default('Not created in this run')) }}"
          collection_rule: "{{ sccm_membership_cleanup.result | default(sccm_membership_cleanup.error | default('Not added by this run')) }}"

    - name: Require successful cleanup for resources owned by this invocation
      ansible.builtin.assert:
        that:
          - >-
            (sccm_window_cleanup.skipped | default(false) | bool) or
            (sccm_window_cleanup.result.cleanup_verified | default(false) | bool)
          - >-
            (sccm_membership_cleanup.skipped | default(false) | bool) or
            (sccm_membership_cleanup.result.direct_rule_removed | default(false) | bool)
        fail_msg: >-
          SCCM cleanup was not verified. Review both cleanup task results.
          Patching success={{ sccm_patch_success }};
          original patch failure={{ sccm_failure_reason | default('') }}.
          Remove any remaining run-owned window/rule manually after checking SCCM.

- name: Report validated outcome
  ansible.builtin.debug:
    msg:
      target: "{{ inventory_hostname }}"
      validated: "{{ sccm_patch_success }}"
      membership_added_by_run: "{{ sccm_membership_added }}"
      failure_reason: "{{ sccm_failure_reason | default('') }}"
      validation: "{{ sccm_final_validation.result | default('Not Collected Yet') }}"    
