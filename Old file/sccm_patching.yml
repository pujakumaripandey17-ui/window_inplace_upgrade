---
- name: Validate configuration
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
      - sccm_management_host | length > 0
      - sccm_management_host in hostvars
      - sccm_site_code is match('^[A-Za-z0-9]{3}$')
      - sccm_provider_server | length > 0
      - sccm_collection_name | length > 0
      - sccm_deployment_names | length > 0
      - sccm_deployment_names is not string
      - sccm_acknowledge_all_deployed_updates | bool
      - sccm_max_rounds | int > 0
      - sccm_poll_seconds | int > 0
      - sccm_poll_retries | int > 0
      - sccm_policy_timeout | int > 0
      - sccm_scan_timeout | int > 0
      - sccm_client_settle_seconds | int >= 30
      - not (sccm_create_collection | bool) or sccm_limiting_collection_id | length > 0
    fail_msg: Configure required variables and acknowledgement. Check mode is intentionally unsupported.

- name: Initialize per-host ownership and completion state
  ansible.builtin.set_fact:
    sccm_patch_done: false
    sccm_membership_added: false
    sccm_patch_success: false
    sccm_failure_reason: ""

- name: Verify upgraded target and client before touching SCCM
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', role_path + '/files/client.ps1') }}"
    parameters:
      Action: Preflight
  register: sccm_target

- name: Debug preflight result
  ansible.builtin.debug:
    var: sccm_target

- name: Reboot upgraded server if preflight detected pending reboot
  ansible.windows.win_reboot:
    reboot_timeout: "{{ sccm_reboot_timeout }}"
    preboot_timeout: 7200
    connect_timeout: 120
    post_reboot_delay: 300
  when:
    - sccm_target.result.reboot_pending | default(false) | bool


- name: Wait for CcmExec service after reboot
  ansible.windows.win_service_info:
    name: CcmExec
  register: ccm_service
  until:
    - ccm_service.services | length > 0
    - ccm_service.services[0].state == 'started'
  retries: 30
  delay: 20
  when:
    - sccm_target.result.reboot_pending | default(false) | bool

- name: Wait for SCCM readiness after reboot
  ansible.windows.win_powershell:
    script: |
      try {
          $svc = Get-Service `
              -Name CcmExec `
              -ErrorAction Stop

          Get-CimInstance `
              -Namespace root\ccm `
              -ClassName SMS_Client `
              -ErrorAction Stop | Out-Null

          if ($svc.Status -eq 'Running') {
              "READY"
          }
      }
      catch {
          "WAIT"
      }
  register: sccm_ready
  until: "'READY' in sccm_ready.output"
  retries: 30
  delay: 20
  when:
    - sccm_target.result.reboot_pending | default(false) | bool

- name: Re-run preflight after reboot
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', role_path + '/files/client.ps1') }}"
    parameters:
      Action: Preflight
  register: sccm_target
  when:
    - sccm_target.result.reboot_pending | default(false) | bool
    
- name: Require reboot condition cleared
  ansible.builtin.assert:
    that:
      - not (sccm_target.result.reboot_pending | default(false) | bool)
    fail_msg: >-
      Reboot pending state persisted after reboot.
      Review CBS servicing state, Windows Update, and SCCM client health.


- name: Manage collection and patch target
  block:
    - name: Resolve collection and verify named deployments before membership change
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', role_path + '/files/management.ps1') }}"
        parameters: "{{ sccm_management_parameters | combine({'Action': 'Prepare'}) }}"
      vars:
        sccm_management_parameters: &management_parameters
          SiteCode: "{{ sccm_site_code }}"
          Provider: "{{ sccm_provider_server }}"
          ModulePath: "{{ sccm_module_path }}"
          CollectionName: "{{ sccm_collection_name }}"
          CreateCollection: "{{ sccm_create_collection | bool }}"
          LimitingCollectionId: "{{ sccm_limiting_collection_id }}"
          DeploymentNames: "{{ sccm_deployment_names }}"
          DeviceName: "{{ inventory_hostname }}"
      delegate_to: "{{ sccm_management_host }}"
      register: sccm_prepare

    - name: Add one-time maintenance window starting now for twelve hours
      ansible.windows.win_powershell:
        script: |
          param(
            [string]$SiteCode,
            [string]$ProviderServer,
            [string]$ModulePath,
            [string]$CollectionName,
            [string]$TargetComputer
           )

          $ErrorActionPreference = 'Stop'
          $Ansible.Changed = $false

          Import-Module $ModulePath -ErrorAction Stop

          $drive = Get-PSDrive -Name $SiteCode -PSProvider CMSite -ErrorAction SilentlyContinue

          if (-not $drive) {
              $drive = New-PSDrive `
                  -Name $SiteCode `
                  -PSProvider CMSite `
                  -Root $ProviderServer
          }

          if ($drive.Root -ine $ProviderServer) {
              throw 'CMSite drive points to a different SMS Provider.'
          }

          Push-Location ($SiteCode + ':\')

          try {

              $collections = @(
                  Get-CMDeviceCollection -Name $CollectionName |
                  Where-Object Name -EQ $CollectionName
              )

              if ($collections.Count -ne 1) {
                  throw "Expected exactly one collection named '$CollectionName'."
              }

              # Local EST time (UTC unchecked)
              $start = Get-Date
              $end   = $start.AddHours(12)

              $mwName = (
                  "Post-upgrade patching - " +
                  $TargetComputer +
                  " - " +
                  $start.ToString('yyyyMMdd-HHmmss')
              )

              $schedule = New-CMSchedule `
                  -Start $start `
                  -End $end `
                  -Nonrecurring

              New-CMMaintenanceWindow `
                  -CollectionId $collections[0].CollectionID `
                  -Name $mwName `
                  -Schedule $schedule `
                  -ApplyTo SoftwareUpdatesOnly `
                  -IsEnabled $true `
                  -Confirm:$false | Out-Null

              $Ansible.Changed = $true

              $Ansible.Result = @{
                  collection_id           = $collections[0].CollectionID
                  maintenance_window_name = $mwName
                  start_local             = $start.ToString('yyyy-MM-dd HH:mm:ss')
                  end_local               = $end.ToString('yyyy-MM-dd HH:mm:ss')
              }

          }
          finally {
              Pop-Location
          }
        parameters:
          SiteCode: "{{ sccm_site_code }}"
          ProviderServer: "{{ sccm_provider_server }}"
          ModulePath: "{{ sccm_module_path }}"
          CollectionName: "{{ sccm_collection_name }}"
          TargetComputer: "{{ inventory_hostname }}"
      delegate_to: "{{ sccm_management_host }}"
      register: sccm_maintenance_window

    - name: Add a direct rule only if neither effective membership nor a direct rule exists
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', role_path + '/files/management.ps1') }}"
        parameters: "{{ sccm_management_parameters | combine({'Action': 'Add', 'CollectionId': sccm_prepare.result.collection_id, 'ResourceId': sccm_prepare.result.resource_id}) }}"
      vars:
        sccm_management_parameters: *management_parameters
      delegate_to: "{{ sccm_management_host }}"
      register: sccm_add

    - name: Record ownership immediately after successful add
      ansible.builtin.set_fact:
        sccm_membership_added: "{{ sccm_add.result.added | bool }}"

    - name: Wait for effective collection membership
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', role_path + '/files/management.ps1') }}"
        parameters: "{{ sccm_management_parameters | combine({'Action': 'Member', 'CollectionId': sccm_prepare.result.collection_id, 'ResourceId': sccm_prepare.result.resource_id}) }}"
      vars:
        sccm_management_parameters: *management_parameters
      delegate_to: "{{ sccm_management_host }}"
      register: sccm_member
      until: sccm_member.result.member | default(false) | bool
      retries: "{{ sccm_poll_retries }}"
      delay: "{{ sccm_poll_seconds }}"

    - name: Retrieve policy and require expected deployment assignments
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', role_path + '/files/client.ps1') }}"
        parameters:
          Action: Policy
          AssignmentIds: "{{ sccm_prepare.result.assignment_ids }}"
          Timeout: "{{ sccm_policy_timeout | int }}"

    - name: Run bounded scan install reboot and rescan rounds
      ansible.builtin.include_tasks: round.yml
      loop: "{{ range(1, (sccm_max_rounds | int) + 1) | list }}"
      loop_control:
        loop_var: sccm_round
      when: not sccm_patch_done | bool

    - name: Require convergence
      ansible.builtin.assert:
        that: sccm_patch_done | bool
        fail_msg: Round limit reached. Inspect SCCM logs before retrying.

    - name: Validate OS client reboot state and application services
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', role_path + '/files/client.ps1') }}"
        parameters:
          Action: Validate
          RequiredServices: "{{ sccm_required_services }}"
      register: sccm_validation

    - name: Perform final SCCM scan
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', role_path + '/files/client.ps1') }}"
        parameters:
          Action: Scan
          Timeout: "{{ sccm_scan_timeout | int }}"

    - name: Allow final applicability evaluation
      ansible.builtin.pause:
        seconds: 300

    - name: Perform final install pass
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', role_path + '/files/client.ps1') }}"
        parameters:
          Action: Install
      register: sccm_final_install

    - name: Monitor final SCCM compliance
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', role_path + '/files/client.ps1') }}"
        parameters:
          Action: Status
          MonitorIds: "{{ sccm_final_install.result.monitor_ids | default([]) }}"
      register: sccm_final_status
      until: sccm_final_status.result.terminal | default(false) | bool
      retries: "{{ sccm_poll_retries }}"
      delay: "{{ sccm_poll_seconds }}"

    - name: Show final SCCM compliance result
      ansible.builtin.debug:
            var: sccm_final_status.result  

    - name: Reboot if SCCM requires reboot after final install
      ansible.windows.win_reboot:
        reboot_timeout: 7200
        connect_timeout: 120
        post_reboot_delay: 300
      when:
        - sccm_final_status.result.reboot | default(false) | bool

    - name: Wait for SCCM readiness after final reboot
      ansible.windows.win_powershell:
        script: |
          try {

              $svc = Get-Service `
                -Name CcmExec `
                -ErrorAction Stop

              Get-CimInstance `
                -Namespace root\ccm `
                -ClassName SMS_Client `
                -ErrorAction Stop | Out-Null

              if ($svc.Status -eq 'Running') {
                  Write-Output "READY"
              }
          }
          catch {
              Write-Output "WAIT"
          }

      register: final_sccm_ready

      until: "'READY' in final_sccm_ready.output"

      retries: 30

      delay: 20

      when:
        - sccm_final_status.result.reboot | default(false) | bool
    

    - name: Capture final OS build
      ansible.windows.win_powershell:
        script: |
          $os = Get-ItemProperty `
            'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'

          $Ansible.Result = @{
            Build     = $os.CurrentBuild
            UBR       = $os.UBR
            FullBuild = "$($os.CurrentBuild).$($os.UBR)"
          }
      register: final_build

   
    - name: Interim patching summary
      ansible.builtin.debug:
        msg:
          target: "{{ inventory_hostname }}"
          build: "{{ final_build.result.Build }}"
          ubr: "{{ final_build.result.UBR }}"
          full_build: "{{ final_build.result.FullBuild }}"
          remaining_updates: "{{ sccm_final_status.result.remaining }}"
          validation: "{{ sccm_final_validation.result | default('Not Collected Yet') }}"

    - name: Require final SCCM compliance
      ansible.builtin.assert:
        that:
          - sccm_final_status.result.remaining | int == 0
        fail_msg: >-
          SCCM discovered additional updates after the final install cycle.
          Remaining={{ sccm_final_status.result.remaining }}
    
    - name: Final SCCM update inventory check
      ansible.windows.win_powershell:
        script: |
          $updates = @(
              Get-CimInstance `
                  -Namespace root\ccm\ClientSDK `
                  -ClassName CCM_SoftwareUpdate `
                  -ErrorAction SilentlyContinue
          )

          $Ansible.Result = @{
              update_count = $updates.Count
              updates = @(
                  $updates |
                  Select Name,ComplianceState,EvaluationState,ErrorCode
              )
          }
      register: sccm_inventory_check

    - name: Require zero pending SCCM updates
      ansible.builtin.assert:
        that:
          - sccm_inventory_check.result.update_count | int == 0
        fail_msg: >-
          SCCM still reports
          {{ sccm_inventory_check.result.update_count }}
          update(s) requiring installation.

    - name: Run final post-patch validation
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', role_path + '/files/client.ps1') }}"
        parameters:
          Action: Validate
          RequiredServices: "{{ sccm_required_services }}"
      register: sccm_final_validation
    
    - name: Mark patching successful
      ansible.builtin.set_fact:
        sccm_patch_success: true

    # - name: Remove temporary maintenance windows
    #   failed_when: false
    #   ansible.windows.win_powershell:
    #     script: |
    #       param(
    #           [string]$SiteCode,
    #           [string]$ProviderServer,
    #           [string]$ModulePath,
    #           [string]$CollectionName,
    #           [string]$TargetComputer
    #       )

