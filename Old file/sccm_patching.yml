    #       CollectionName: "{{ sccm_collection_name }}"
    #       TargetComputer: "{{ inventory_hostname }}"

    #   delegate_to: "{{ sccm_management_host }}"
    #   when: sccm_patch_success | bool

    # - name: Remove only the direct rule added by this invocation after successful validation
    #   ansible.windows.win_powershell:
    #     script: "{{ lookup('ansible.builtin.file', role_path + '/files/management.ps1') }}"
    #     parameters: "{{ sccm_management_parameters | combine({'Action': 'Remove', 'CollectionId': sccm_prepare.result.collection_id, 'ResourceId': sccm_prepare.result.resource_id}) }}"
    #   vars:
    #     sccm_management_parameters: *management_parameters
    #   delegate_to: "{{ sccm_management_host }}"
    #   when: sccm_membership_added | bool and sccm_patch_success | bool

  rescue:
  
    - name: Capture failure reason
      ansible.builtin.set_fact:
        sccm_patch_success: false
        sccm_failure_reason: >-
          {{ ansible_failed_result.msg | default(ansible_failed_result) }}

    - name: Report patching failure
      ansible.builtin.debug:
        msg:
          target: "{{ inventory_hostname }}"
          failure: "{{ sccm_failure_reason }}"

  always:

    - name: Remove temporary maintenance windows
      failed_when: false
      ansible.windows.win_powershell:
        script: |
          param(
              [string]$SiteCode,
              [string]$ProviderServer,
              [string]$ModulePath,
              [string]$CollectionName,
              [string]$TargetComputer
          )

          $ErrorActionPreference = 'Stop'

          Import-Module $ModulePath -ErrorAction Stop

          if (-not (Get-PSDrive -Name $SiteCode -PSProvider CMSite -ErrorAction SilentlyContinue)) {
              New-PSDrive `
                  -Name $SiteCode `
                  -PSProvider CMSite `
                  -Root $ProviderServer | Out-Null
          }

          Push-Location ($SiteCode + ':\')

          try {

              $collection = Get-CMDeviceCollection `
                  -Name $CollectionName

              $windows = @(
                  Get-CMMaintenanceWindow `
                      -CollectionId $collection.CollectionID `
                      -MaintenanceWindowName ("Post-upgrade patching - " + $TargetComputer + "*") `
                      -ForceWildcardHandling
              )

              foreach ($window in $windows) {

                  Remove-CMMaintenanceWindow `
                      -CollectionId $collection.CollectionID `
                      -MaintenanceWindowName $window.Name `
                      -Confirm:$false `
                      -Force
              }

              $Ansible.Result = @{
                  removed_windows = $windows.Count
              }
          }
          finally {
              Pop-Location
          }

        parameters:
          SiteCode: "{{ sccm_site_code }}"
          ProviderServer: "{{ sccm_provider_server }}"
          ModulePath: "{{ sccm_module_path }}"
          CollectionName: "{{ sccm_collection_name }}"
          TargetComputer: "{{ inventory_hostname }}"

      delegate_to: "{{ sccm_management_host }}"

      when:
        - sccm_maintenance_window is defined

    - name: Remove direct rule added by this invocation
      failed_when: false
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', role_path + '/files/management.ps1') }}"
        parameters: "{{ sccm_management_parameters | combine({
          'Action': 'Remove',
          'CollectionId': sccm_prepare.result.collection_id,
          'ResourceId': sccm_prepare.result.resource_id
        }) }}"
      vars:
        sccm_management_parameters: *management_parameters
      delegate_to: "{{ sccm_management_host }}"
      when:
        - sccm_add is defined
        - sccm_prepare is defined    
- name: Report validated outcome
  ansible.builtin.debug:
    msg:
      target: "{{ inventory_hostname }}"
      validated: "{{ sccm_patch_success }}"
      membership_added_by_run: "{{ sccm_membership_added }}"
      failure_reason: "{{ sccm_failure_reason | default('') }}"
      validation: "{{ sccm_final_validation.result | default('Not Collected Yet') }}"    

