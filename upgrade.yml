---
- name: Upgrade an approved Windows test server to Windows Server 2022
  hosts: windows_upgrade
  gather_facts: false
  serial: 1

  pre_tasks:

    - name: Require explicit upgrade authorization
      ansible.builtin.assert:
        that:
          - allow_windows_in_place_upgrade | default(false) | bool
          - allow_snapshot_create | default(false) | bool
          - allow_service_stop | default(false) | bool
          - change_number | default('') | length > 0
        fail_msg: >-
          Upgrade is disabled. Use the approved Jenkins pipeline and provide
          a valid change number.

  tasks:

    - name: Run controlled Windows upgrade workflow
      block:

        - name: Run final eligibility assessment
          ansible.builtin.include_role:
            name: windows_upgrade_assessment

        - name: Resolve VM information from VCCombined workbook
          ansible.builtin.include_role:
            name: windows_upgrade_vm_discovery

        - name: Ensure and verify pre-upgrade VM snapshot through vCenter API
          ansible.builtin.include_role:
            name: windows_upgrade_snapshot
          vars:
            snapshot_action: create

        - name: Record that snapshot verification completed
          ansible.builtin.set_fact:
            upgrade_snapshot_verified: true

        - name: Enable CredSSP server role when required
          ansible.builtin.include_role:
            name: windows_upgrade_credssp
          vars:
            credssp_action: enable

        - name: Reset WinRM connection
          ansible.builtin.meta: reset_connection

        - name: Verify WinRM connectivity
          ansible.builtin.wait_for_connection:
            timeout: 300
            sleep: 10
            
        - name: Capture and stop SQL and IIS services
          ansible.builtin.include_role:
            name: windows_upgrade_service_control
          vars:
            service_control_action: stop

        - name: Re-run native Windows Setup compatibility scan immediately before upgrade
          ansible.builtin.include_role:
            name: windows_upgrade_compatibility

        - name: Record that Windows Setup is about to be launched
          ansible.builtin.set_fact:
            upgrade_setup_launch_authorized: true

        - name: Launch and monitor Windows in-place upgrade
          ansible.builtin.include_role:
            name: windows_upgrade_execute

        - name: Restore SQL and IIS services
          ansible.builtin.include_role:
            name: windows_upgrade_service_control
          vars:
            service_control_action: restore

        - name: Restore original CredSSP configuration
          ansible.builtin.include_role:
            name: windows_upgrade_credssp
          vars:
            credssp_action: restore

        - name: Wait for restored services to stabilize
          ansible.builtin.pause:
            minutes: 5

        - name: Validate or install .NET Framework 4.8.1
          ansible.builtin.include_role:
            name: windows_upgrade_dotnet

        - name: Run technical post-upgrade validation
          ansible.builtin.include_role:
            name: windows_upgrade_postcheck

        - name: Create and send successful upgrade report
          ansible.builtin.include_role:
            name: windows_upgrade_reporting
          vars:
            upgrade_final_status: SUCCESS
            upgrade_failure_reason: ""

      rescue:

        - name: Wait for target recovery
          ansible.builtin.wait_for_connection:
            delay: 30
            sleep: 30
            timeout: 1800
          ignore_errors: true

        - name: Capture failure reason
          ansible.builtin.set_fact:
            upgrade_failure_reason: >-
              {{
                ansible_failed_result.msg
                | default('Windows upgrade workflow failed.')
              }}

        - name: Send failure report
          ansible.builtin.include_role:
            name: windows_upgrade_reporting
          vars:
            upgrade_final_status: FAILED
            upgrade_failure_reason: FAILED

        - name: Fail workflow
          ansible.builtin.fail:
            msg: >-
              Workflow failed.
              Reason: {{ upgrade_failure_reason }}

      always:

        - name: Attempt service restoration
          ansible.builtin.include_role:
            name: windows_upgrade_service_control
          vars:
            service_control_action: restore
          ignore_errors: true

        - name: Attempt CredSSP restoration
          ansible.builtin.include_role:
            name: windows_upgrade_credssp
          vars:
            credssp_action: restore
          ignore_errors: true
